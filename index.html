<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miau Portfolio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<video autoplay muted loop playsinline id="bg-video">
    <source src="video.mp4" type="video/mp4">
</video>
<canvas id="particles"></canvas>

<div class="music-player">

    <img src="cover.jpg" class="cover">

    <div class="music-info">
        <h3>Música</h3>
        <p>Artista</p>

        <audio id="audio" src="musica.mp3"></audio>

        <input
            type="range"
            id="progress"
            value="0"
            min="0"
            max="100">

        <div class="controls">
            <button id="playBtn">▶</button>
        </div>

    </div>

</div>

<header class="hero">
    <img src="perfil.jpg" class="profile" alt="Perfil">
    <h1>Miau</h1>
    <p>Portfólio • Desenvolvedor • Criador</p>
</header>

<section class="glass-card">
    <h2>Sobre Mim</h2>
    <p>Escreva aqui sua apresentação.</p>
</section>

<section class="glass-card">
    <h2>Galeria</h2>
    <div class="gallery">
        <img src="foto1.jpg">
        <img src="foto2.jpg">
        <img src="foto3.jpg">
        <img src="foto4.jpg">
    </div>
</section>

<section class="glass-card">
    <h2>Feedback</h2>

    <form id="feedbackForm">
        <input id="nome" placeholder="Seu nome" required>
        <textarea id="mensagem" placeholder="Seu feedback" required></textarea>
        <button type="submit">Enviar</button>
    </form>

    <div id="feedbacks"></div>
</section>

<script>
const form = document.getElementById("feedbackForm");
const lista = document.getElementById("feedbacks");

function carregar(){
    const dados = JSON.parse(localStorage.getItem("feedbacks") || "[]");
    lista.innerHTML = "";
    dados.forEach(item=>{
        const div = document.createElement("div");
        div.className = "feedback";
        div.innerHTML = "<strong>"+item.nome+"</strong><p>"+item.msg+"</p>";
        lista.appendChild(div);
    });
}

form.addEventListener("submit", e=>{
    e.preventDefault();

    const dados = JSON.parse(localStorage.getItem("feedbacks") || "[]");

    dados.push({
        nome: nome.value,
        msg: mensagem.value
    });

    localStorage.setItem("feedbacks", JSON.stringify(dados));
    form.reset();
    carregar();
});

carregar();

const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

let particles = [];

for(let i=0;i<80;i++){
    particles.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        r:Math.random()*2+1,
        dx:(Math.random()-0.5),
        dy:(Math.random()-0.5)
    });
}

function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    particles.forEach(p=>{
        p.x+=p.dx;
        p.y+=p.dy;

        if(p.x<0||p.x>canvas.width)p.dx*=-1;
        if(p.y<0||p.y>canvas.height)p.dy*=-1;

        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle="rgba(255,255,255,.5)";
        ctx.fill();
    });

    requestAnimationFrame(animate);
}

animate();

const audio = document.getElementById("audio");
const playBtn = document.getElementById("playBtn");
const progress = document.getElementById("progress");

playBtn.onclick = () => {

    if(audio.paused){
        audio.play();
        playBtn.innerHTML = "❚❚";
    }else{
        audio.pause();
        playBtn.innerHTML = "▶";
    }

};

audio.addEventListener("timeupdate", () => {

    progress.value =
    (audio.currentTime / audio.duration) * 100;

});

progress.addEventListener("input", () => {

    audio.currentTime =
    (progress.value / 100) * audio.duration;

});
</script>

</body>
</html>
